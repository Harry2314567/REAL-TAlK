<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realtime Walkie Talkie - Web App</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0f172a; color: #fff; margin: 0; padding: 20px; box-sizing: border-box; }
    #talkBtn { width: 220px; height: 220px; border-radius: 50%; font-size: 20px; font-weight: bold; background: #1e293b; color: #38bdf8; border: 4px solid #38bdf8; cursor: pointer; user-select: none; touch-action: manipulation; transition: all 0.2s ease; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
    #talkBtn.active { background: #ef4444; color: #fff; border-color: #f87171; box-shadow: 0 0 30px rgba(239, 68, 68, 0.5); }
    #status { margin-top: 25px; font-size: 16px; color: #94a3b8; font-weight: 500; }
    .device-box { margin-top: 20px; width: 100%; max-width: 300px; text-align: center; }
    select { width: 100%; padding: 12px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; font-size: 14px; margin-top: 6px; outline: none; }
    .audio-player { display: none; }
  </style>
</head>
<body>
  <h1>Web Walkie Talkie</h1>
  
  <button id="talkBtn">TAP TO TALK</button>

  <div class="device-box">
    <label for="micSelect" style="font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Input Device</label>
    <select id="micSelect"></select>
  </div>

  <div id="status">Connecting...</div>
  <audio id="dummyAudio" class="audio-player" loop src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const talkBtn = document.getElementById('talkBtn');
    const statusDiv = document.getElementById('status');
    const micSelect = document.getElementById('micSelect');
    const dummyAudio = document.getElementById('dummyAudio');

    let mediaRecorder;
    let audioStream;
    let isTransmitting = false;

    socket.on('connect', () => { statusDiv.innerText = 'Connected - Ready'; });
    socket.on('disconnect', () => { statusDiv.innerText = 'Disconnected'; });

    // Incoming audio playback
    socket.on('audio-stream', (audioChunk) => {
      const blob = new Blob([audioChunk], { type: 'audio/webm' });
      const audioUrl = URL.createObjectURL(blob);
      const audio = new Audio(audioUrl);
      audio.play().catch(e => console.log('Autoplay blocked:', e));
    });

    // Fetch and auto-select Bluetooth devices
    async function loadAudioDevices() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioStream = stream;

        const devices = await navigator.mediaDevices.enumerateDevices();
        const inputs = devices.filter(d => d.kind === 'audioinput');

        micSelect.innerHTML = '';
        inputs.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Microphone ${index + 1}`;
          
          if (device.label.toLowerCase().includes('bluetooth') || device.label.toLowerCase().includes('hands-free')) {
            option.selected = true;
          }
          micSelect.appendChild(option);
        });

        if (micSelect.value) {
          switchMicrophone(micSelect.value);
        }
      } catch (err) {
        statusDiv.innerText = 'Microphone access denied!';
      }
    }

    async function switchMicrophone(deviceId) {
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
      }
      audioStream = await navigator.mediaDevices.getUserMedia({
        audio: { deviceId: { exact: deviceId } }
      });
    }

    micSelect.addEventListener('change', () => switchMicrophone(micSelect.value));

    function toggleTalk() {
      if (!isTransmitting) {
        startTransmitting();
      } else {
        stopTransmitting();
      }
    }

    function startTransmitting() {
      if (!audioStream) return;
      isTransmitting = true;
      talkBtn.classList.add('active');
      talkBtn.innerText = 'TRANSMITTING';
      statusDiv.innerText = 'Transmitting live...';

      mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });
      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0 && socket.connected) {
          socket.emit('audio-stream', event.data);
        }
      };
      mediaRecorder.start(200);
    }

    function stopTransmitting() {
      if (!isTransmitting) return;
      isTransmitting = false;
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      talkBtn.classList.remove('active');
      talkBtn.innerText = 'TAP TO TALK';
      statusDiv.innerText = 'Connected - Ready';
    }

    talkBtn.addEventListener('click', () => {
      dummyAudio.play().catch(() => {});
      toggleTalk();
    });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => startTransmitting());
      navigator.mediaSession.setActionHandler('pause', () => stopTransmitting());
      navigator.mediaSession.setActionHandler('previoustrack', () => toggleTalk());
      navigator.mediaSession.setActionHandler('nexttrack', () => toggleTalk());
    }

    navigator.mediaDevices.addEventListener('devicechange', loadAudioDevices);
    loadAudioDevices();
  </script>
</body>
</html>
