<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Squad Radio Comms</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      color: #00ff66;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.1s ease;
    }

    body.alert-active {
      animation: alertFlash 0.3s infinite alternate;
    }

    @keyframes alertFlash {
      0% { background-color: #0d0d0d; }
      100% { background-color: #660000; }
    }

    #app-container {
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: #141414;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      transition: background 0.1s ease;
    }

    body.alert-active #app-container {
      background: rgba(30, 0, 0, 0.9);
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid #222;
    }

    .status-badge {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #1a2a1e;
      color: #00ff66;
      border: 1px solid #00ff66;
    }

    .status-badge.offline {
      background: #2a1a1a;
      color: #ff3333;
      border-color: #ff3333;
    }

    .name-section {
      width: 100%;
      margin-top: 14px;
      display: flex;
      gap: 8px;
    }

    #username-input {
      flex: 1;
      background: #0d0d0d;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    #username-input:focus {
      border-color: #00ff66;
    }

    #save-name-btn {
      background: rgba(0, 255, 102, 0.15);
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }

    #save-name-btn:active {
      background: #00ff66;
      color: #000;
    }

    .ptt-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 15px 0;
    }

    #ptt-btn {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 4px solid #00ff66;
      background: radial-gradient(circle, rgba(0,255,102,0.15) 0%, rgba(0,0,0,0.8) 100%);
      color: #00ff66;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.2);
      outline: none;
      touch-action: manipulation;
      user-select: none;
      transition: all 0.1s ease;
    }

    #ptt-btn:active, #ptt-btn.transmitting {
      background: #00ff66;
      color: #000;
      box-shadow: 0 0 50px #00ff66;
      transform: scale(0.96);
    }

    #alert-btn {
      width: 100%;
      padding: 12px;
      background: rgba(255, 51, 51, 0.2);
      border: 2px solid #ff3333;
      color: #ff3333;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
    }

    #alert-btn:active {
      background: #ff3333;
      color: #000;
      box-shadow: 0 0 20px #ff3333;
    }

    .squad-section {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-top: 10px;
    }

    .squad-title {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    #squad-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .squad-card {
      background: #1c1c1c;
      padding: 10px 14px;
      border-radius: 6px;
      border-left: 3px solid #00ff66;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .squad-card.talking {
      border-left-color: #ffcc00;
      background: #262215;
    }

    .callsign {
      color: #fff;
      font-weight: bold;
      font-size: 13px;
    }

    .member-status {
      font-size: 10px;
      color: #888;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div class="header">
      <h3 style="letter-spacing: 1px;">SQUAD RADIO</h3>
      <div id="connection-status" class="status-badge">CONNECTING...</div>
    </div>

    <div class="name-section">
      <input type="text" id="username-input" placeholder="ENTER CALLSIGN..." maxlength="15" />
      <button id="save-name-btn" onclick="updateCallsign()">SET NAME</button>
    </div>

    <div class="ptt-wrapper">
      <button id="ptt-btn">HOLD TO TALK</button>
      <button id="alert-btn" onclick="triggerAlert()">🚨 EMERGENCY ALERT 🚨</button>
    </div>

    <div class="squad-section">
      <div class="squad-title">ACTIVE FREQUENCY</div>
      <div id="squad-list"></div>
    </div>
  </div>

  <div id="audio-container" style="display: none;"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let audioCtx = null;
    let localStream = null;
    let myId = null;

    const peerConnections = {};

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    let callsign = localStorage.getItem('squad_callsign') || ('SOLDIER-' + Math.floor(1000 + Math.random() * 9000));
    document.getElementById('username-input').value = callsign;

    function updateCallsign() {
      const inputVal = document.getElementById('username-input').value.trim();
      if (!inputVal) return;
      callsign = inputVal;
      localStorage.setItem('squad_callsign', callsign);

      socket.emit('join-room', { room: 'ALPHA-1', username: callsign });
      if (myId) {
        addOrUpdateMember(myId, callsign, false);
      }
    }

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.1;
      window.speechSynthesis.speak(utterance);
    }

    function playPing() {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    }

    // High-Intensity Emergency Siren Audio
    function playEmergencySiren() {
      const ctx = getAudioContext();
      const cycles = 4;
      const cycleDuration = 0.25;

      for (let i = 0; i < cycles; i++) {
        const startTime = ctx.currentTime + (i * cycleDuration);
        
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(900, startTime);
        osc.frequency.exponentialRampToValueAtTime(1800, startTime + (cycleDuration / 2));
        osc.frequency.exponentialRampToValueAtTime(900, startTime + cycleDuration);

        gain.gain.setValueAtTime(0.6, startTime);
        gain.gain.exponentialRampToValueAtTime(0.01, startTime + cycleDuration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(startTime);
        osc.stop(startTime + cycleDuration);
      }
    }

    // Triggers Screen Flashing + Siren + TTS Alert
    function playAlertSequence(senderUsername) {
      playEmergencySiren();

      // Visual flashing
      document.body.classList.add('alert-active');
      setTimeout(() => {
        document.body.classList.remove('alert-active');
      }, 1200);

      // Voice warning announcement
      setTimeout(() => {
        speak(`Alert from ${senderUsername || 'unknown user'}`);
      }, 1000);
    }

    function playGlitchNoise() {
      const ctx = getAudioContext();
      const bufferSize = ctx.sampleRate * 0.15;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const whiteNoise = ctx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1000;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      whiteNoise.start();
    }

    async function initAudio() {
      if (localStream) return localStream;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        localStream.getAudioTracks().forEach(track => track.enabled = false);
        return localStream;
      } catch (e) {
        console.error("Microphone access error:", e);
      }
    }

    function createPeerConnection(targetSocketId) {
      if (peerConnections[targetSocketId]) return peerConnections[targetSocketId];

      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections[targetSocketId] = pc;

      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('webrtc-ice-candidate', {
            targetId: targetSocketId,
            candidate: event.candidate
          });
        }
      };

      pc.ontrack = (event) => {
        let audioEl = document.getElementById(`audio-${targetSocketId}`);
        if (!audioEl) {
          audioEl = document.createElement('audio');
          audioEl.id = `audio-${targetSocketId}`;
          audioEl.autoplay = true;
          audioEl.playsInline = true;
          document.getElementById('audio-container').appendChild(audioEl);
        }
        audioEl.srcObject = event.streams[0];
      };

      return pc;
    }

    async function initiateWebRTCCall(targetSocketId) {
      const pc = createPeerConnection(targetSocketId);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      socket.emit('webrtc-offer', {
        targetId: targetSocketId,
        offer: offer
      });
    }

    socket.on('webrtc-offer', async ({ senderId, offer }) => {
      await initAudio();
      const pc = createPeerConnection(senderId);
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      socket.emit('webrtc-answer', {
        targetId: senderId,
        answer: answer
      });
    });

    socket.on('webrtc-answer', async ({ senderId, answer }) => {
      const pc = peerConnections[senderId];
      if (pc) {
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
      }
    });

    socket.on('webrtc-ice-candidate', async ({ senderId, candidate }) => {
      const pc = peerConnections[senderId];
      if (pc && candidate) {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (e) {
          console.error("Error adding ICE candidate", e);
        }
      }
    });

    // PTT Controls
    const pttBtn = document.getElementById('ptt-btn');

    async function startTransmit() {
      getAudioContext();
      await initAudio();
      if (!localStream) return;

      pttBtn.classList.add('transmitting');
      pttBtn.innerText = "TRANSMITTING";
      localStream.getAudioTracks().forEach(t => t.enabled = true);
      socket.emit('talk-status', { talking: true, username: callsign });
    }

    function stopTransmit() {
      if (!localStream) return;
      pttBtn.classList.remove('transmitting');
      pttBtn.innerText = "HOLD TO TALK";
      localStream.getAudioTracks().forEach(t => t.enabled = false);
      socket.emit('talk-status', { talking: false, username: callsign });
    }

    pttBtn.addEventListener('mousedown', startTransmit);
    pttBtn.addEventListener('mouseup', stopTransmit);
    pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTransmit(); });
    pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTransmit(); });

    function triggerAlert() {
      getAudioContext();
      socket.emit('send-alert', { username: callsign });
    }

    /* HEADPHONE MEDIA BUTTON GESTURE CONTROLS */
    let tapCount = 0;
    let tapTimer = null;
    let isHolding = false;

    if ('mediaSession' in navigator) {
      const handleMediaButton = (e) => {
        tapCount++;
        clearTimeout(tapTimer);

        if (!isHolding) {
          isHolding = true;

          // Single Tap + Hold -> PTT Transmit
          if (tapCount === 1) {
            startTransmit();
          } 
          // Double Tap + Hold -> Send Alert
          else if (tapCount >= 2) {
            triggerAlert();
          }
        }

        tapTimer = setTimeout(() => {
          if (isHolding) {
            stopTransmit();
            isHolding = false;
          }
          tapCount = 0;
        }, 300);
      };

      navigator.mediaSession.setActionHandler('play', handleMediaButton);
      navigator.mediaSession.setActionHandler('pause', handleMediaButton);
    }

    // Socket Event Handlers
    socket.on('connect', async () => {
      myId = socket.id;
      const statusEl = document.getElementById('connection-status');
      statusEl.innerText = 'ONLINE';
      statusEl.classList.remove('offline');

      playPing();
      setTimeout(() => speak("Online"), 200);

      await initAudio();
      socket.emit('join-room', { room: 'ALPHA-1', username: callsign });
    });

    socket.on('disconnect', () => {
      const statusEl = document.getElementById('connection-status');
      statusEl.innerText = 'OFFLINE';
      statusEl.classList.add('offline');

      playGlitchNoise();
      setTimeout(() => speak("Disconnected"), 200);

      Object.keys(peerConnections).forEach(id => {
        peerConnections[id].close();
        delete peerConnections[id];
      });
    });

    socket.on('joined-successfully', ({ members }) => {
      renderSquad(members);
      members.forEach(m => {
        if (m.id !== myId) {
          initiateWebRTCCall(m.id);
        }
      });
    });

    socket.on('user-joined', ({ id, username }) => {
      playPing();
      setTimeout(() => speak("Connected"), 200);
      addOrUpdateMember(id, username, false);
    });

    socket.on('user-left', ({ id }) => {
      playGlitchNoise();
      setTimeout(() => speak("Disconnected"), 200);

      const el = document.getElementById(`user-${id}`);
      if (el) el.remove();

      const audioEl = document.getElementById(`audio-${id}`);
      if (audioEl) audioEl.remove();

      if (peerConnections[id]) {
        peerConnections[id].close();
        delete peerConnections[id];
      }
    });

    socket.on('user-talk-status', ({ id, username, talking }) => {
      addOrUpdateMember(id, username, talking);
    });

    socket.on('receive-alert', ({ username }) => {
      playAlertSequence(username);
    });

    function renderSquad(members) {
      const listEl = document.getElementById('squad-list');
      listEl.innerHTML = '';
      members.forEach(m => addOrUpdateMember(m.id, m.username, false));
    }

    function addOrUpdateMember(id, username, talking) {
      const listEl = document.getElementById('squad-list');
      let card = document.getElementById(`user-${id}`);

      if (!card) {
        card = document.createElement('div');
        card.id = `user-${id}`;
        listEl.appendChild(card);
      }

      card.className = `squad-card ${talking ? 'talking' : ''}`;
      card.innerHTML = `
        <div>
          <div class="callsign">${username || 'SOLDIER'} ${id === myId ? '(YOU)' : ''}</div>
          <div class="member-status">${talking ? 'TRANSMITTING...' : 'STANDBY'}</div>
        </div>
      `;
    }
  </script>
</body>
</html>
