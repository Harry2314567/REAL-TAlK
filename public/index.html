<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live GPS Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
    }

    #app-viewport {
      display: flex;
      width: 200vw;
      height: 100vh;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      flex-shrink: 0;
      position: relative;
    }

    #dashboard {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: #1e1e1e;
    }

    h2 {
      color: #00ff66;
    }

    .user-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .user-card {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-btn {
      background: #00ff66;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 1px solid #00ff66;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="app-viewport">
    <!-- Screen 1: User List / Dashboard -->
    <div class="screen" id="dashboard">
      <h2>Active Tracker</h2>
      <p>Select a user to navigate:</p>
      <ul class="user-list" id="user-list"></ul>
    </div>

    <!-- Screen 2: Map View -->
    <div class="screen">
      <button class="back-btn" onclick="showDashboard()">← Dashboard</button>
      <div id="map"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let map;
    let myId = null;
    let myLatLng = { lat: 0, lng: 0 };
    const friendLocations = {};
    const mapMarkers = {};
    let currentPolyline = null;

    // Get current GPS location
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (position) => {
          myLatLng = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };

          socket.emit('send-location', myLatLng);

          if (map && mapMarkers[myId]) {
            mapMarkers[myId].position = myLatLng;
          }
        },
        (err) => console.error(err),
        { enableHighAccuracy: true }
      );
    }

    socket.on('connect', () => {
      myId = socket.id;
    });

    // Handle incoming locations from other users
    socket.on('friend-location', ({ id, username, lat, lng }) => {
      friendLocations[id] = { lat: Number(lat), lng: Number(lng), username };
      updateUserList();

      if (map && window.google && google.maps.marker) {
        if (mapMarkers[id]) {
          mapMarkers[id].position = { lat: Number(lat), lng: Number(lng) };
        } else {
          const pin = new google.maps.marker.PinElement({
            background: "#ff3333",
            borderColor: "#ffffff",
            glyphColor: "#ffffff"
          });

          // FIX 2: Passing 'pin' directly instead of 'pin.element'
          mapMarkers[id] = new google.maps.marker.AdvancedMarkerElement({
            position: { lat: Number(lat), lng: Number(lng) },
            map: map,
            title: username || "Friend",
            content: pin
          });
        }
      }
    });

    socket.on('user-disconnected', (id) => {
      delete friendLocations[id];
      if (mapMarkers[id]) {
        mapMarkers[id].map = null;
        delete mapMarkers[id];
      }
      updateUserList();
    });

    function updateUserList() {
      const listEl = document.getElementById('user-list');
      listEl.innerHTML = '';
      for (const [id, user] of Object.entries(friendLocations)) {
        if (id === myId) continue;
        const li = document.createElement('li');
        li.className = 'user-card';
        li.innerHTML = `
          <span>${user.username || 'User ' + id.slice(0, 4)}</span>
          <button class="nav-btn" onclick="navigateToUser('${id}')">Navigate</button>
        `;
        listEl.appendChild(li);
      }
    }

    function showDashboard() {
      document.getElementById('app-viewport').scrollTo({ left: 0, behavior: 'smooth' });
    }

    // FIX 1: Removed 'styles' array to prevent conflict with 'mapId'
    function initMap() {
      const startPos = { lat: Number(myLatLng.lat), lng: Number(myLatLng.lng) };

      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 14,
        center: startPos,
        mapId: "DEMO_MAP_ID",
        disableDefaultUI: true
      });

      const selfPin = new google.maps.marker.PinElement({
        background: "#00ff66",
        borderColor: "#ffffff",
        glyphColor: "#000000"
      });

      // FIX 2: Passing 'selfPin' directly instead of 'selfPin.element'
      mapMarkers[myId] = new google.maps.marker.AdvancedMarkerElement({
        position: startPos,
        map: map,
        title: "YOU",
        content: selfPin
      });
    }

    // FIX 3: Converting lat/lng values strictly to Numbers for Routes API
    async function navigateToUser(targetId) {
      const target = friendLocations[targetId];
      if (!target) return alert("Target location unavailable.");

      const viewport = document.getElementById('app-viewport');
      viewport.scrollTo({ left: window.innerWidth, behavior: 'smooth' });

      const originLatLng = { lat: Number(myLatLng.lat), lng: Number(myLatLng.lng) };
      const destLatLng = { lat: Number(target.lat), lng: Number(target.lng) };

      try {
        const response = await google.maps.routes.Route.computeRoutes({
          origin: { location: { latLng: originLatLng } },
          destination: { location: { latLng: destLatLng } },
          travelMode: 'DRIVE'
        });

        if (response.routes && response.routes.length > 0) {
          const route = response.routes[0];
          const path = google.maps.geometry.encoding.decodePath(route.polyline.encodedPolyline);

          if (currentPolyline) currentPolyline.setMap(null);

          currentPolyline = new google.maps.Polyline({
            path: path,
            geodesic: true,
            strokeColor: "#00ff66",
            strokeOpacity: 0.9,
            strokeWeight: 5,
            map: map
          });

          const bounds = new google.maps.LatLngBounds();
          path.forEach(pt => bounds.extend(pt));
          map.fitBounds(bounds);
        }
      } catch (err) {
        console.error("Navigation routing failed:", err);
      }
    }
  </script>

  <!-- Google Maps API Script -->
  <!-- REMEMBER: Replace YOUR_FULL_ACTUAL_API_KEY_HERE with your real key -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDtQzAOxGO5wkQuk8YI-QezE7Z-KJbGkFo&loading=async&libraries=routes,marker,geometry&callback=initMap" async defer></script>
</body>
</html>
