<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Real Talk HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      color: #0f0;
      overflow: hidden;
    }

    /* Swipeable Viewport Wrapper */
    #app-viewport {
      display: flex;
      width: 200vw;
      height: 100vh;
      overflow-x: scroll;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    /* Hide scrollbars */
    #app-viewport::-webkit-scrollbar {
      display: none;
    }
    #app-viewport {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Pages */
    .page {
      width: 100vw;
      height: 100vh;
      scroll-snap-align: start;
      flex-shrink: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* PAGE 1: TRANSMIT & SQUAD */
    #page-comms {
      padding: 16px;
      background: #0a0a0a;
      justify-content: flex-start;
      align-items: center;
    }

    .status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #00ff66;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    /* PTT Transmit Button */
    #ptt-btn {
      width: 100%;
      height: 90px;
      border-radius: 12px;
      border: 2px solid #00ff66;
      background: rgba(0, 255, 102, 0.05);
      color: #00ff66;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
      transition: all 0.1s ease;
      touch-action: manipulation;
    }

    #ptt-btn:active, #ptt-btn.active {
      background: #00ff66;
      color: #000;
      box-shadow: 0 0 30px #00ff66;
      transform: scale(0.98);
    }

    .swipe-hint {
      font-size: 10px;
      color: #555;
      margin: 10px 0 6px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Squad List */
    .squad-title {
      width: 100%;
      font-size: 12px;
      color: #888;
      margin-top: 10px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #222;
      padding-bottom: 4px;
    }

    #squad-list {
      width: 100%;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .squad-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #141414;
      border-left: 3px solid #00ff66;
      padding: 10px 12px;
      border-radius: 6px;
    }

    .squad-info {
      display: flex;
      flex-direction: column;
    }

    .squad-callsign {
      color: #fff;
      font-weight: 700;
      font-size: 14px;
    }

    .squad-status {
      font-size: 10px;
      color: #888;
    }

    .nav-btn {
      background: #00ff66;
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
    }

    /* PAGE 2: FULLSCREEN MAP */
    #page-map {
      background: #000;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    #map-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #00ff66;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      color: #00ff66;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="app-viewport">
    
    <!-- PAGE 1: COMMS & TRANSMIT -->
    <section class="page" id="page-comms">
      <div class="status-bar">
        <span>CH: 142.800</span>
        <span id="gps-status">GPS: LOCKING...</span>
      </div>

      <!-- TRANSMIT BUTTON ON TOP -->
      <button id="ptt-btn">PUSH TO TRANSMIT</button>

      <div class="swipe-hint">SLIDE RIGHT FOR MAP &rarr;</div>

      <div class="squad-title">SQUAD MEMBERS</div>
      
      <div id="squad-list">
        <!-- Live Squad members rendered dynamically -->
        <div class="squad-card">
          <div class="squad-info">
            <span class="squad-callsign">ALPHA-1 (YOU)</span>
            <span class="squad-status">LIVE | TRANSMITTER READY</span>
          </div>
        </div>
      </div>
    </section>

    <!-- PAGE 2: MAP PAGE -->
    <section class="page" id="page-map">
      <div id="map-overlay">&larr; SWIPE LEFT FOR COMMS | TACTICAL HUD</div>
      <div id="map"></div>
    </section>

  </div>

  <script>
    // --- APP STATE ---
    let map, directionsService, directionsRenderer;
    let myMarker, myLatLng = null;
    let isTransmitting = false;

    // --- PTT AUDIO HANDLERS ---
    const pttBtn = document.getElementById('ptt-btn');

    function startTransmit() {
      if (isTransmitting) return;
      isTransmitting = true;
      pttBtn.classList.add('active');
      pttBtn.innerText = "TRANSMITTING...";
      // WebRTC audio broadcast logic here
    }

    function stopTransmit() {
      if (!isTransmitting) return;
      isTransmitting = false;
      pttBtn.classList.remove('active');
      pttBtn.innerText = "PUSH TO TRANSMIT";
      // Stop WebRTC audio broadcast logic here
    }

    pttBtn.addEventListener('mousedown', startTransmit);
    pttBtn.addEventListener('mouseup', stopTransmit);
    pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTransmit(); });
    pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTransmit(); });

    // --- GEOLOCATION TRACKING ---
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          myLatLng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          document.getElementById('gps-status').innerText = "GPS: LOCKED";
          if (map && myMarker) {
            myMarker.setPosition(myLatLng);
          }
        },
        (err) => {
          document.getElementById('gps-status').innerText = "GPS: ERROR";
        },
        { enableHighAccuracy: true }
      );
    }

    // --- MAP INITIALIZATION ---
    function initMap() {
      const defaultCenter = { lat: 0, lng: 0 };
      
      // Initialize Map with dark custom tactical theme
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 15,
        center: defaultCenter,
        disableDefaultUI: true,
        styles: [
          { elementType: "geometry", stylers: [{ color: "#212121" }] },
          { elementType: "labels.icon", stylers: [{ visibility: "off" }] },
          { elementType: "labels.text.fill", stylers: [{ color: "#757575" }] },
          { elementType: "labels.text.stroke", stylers: [{ color: "#212121" }] },
          { featureType: "administrative", elementType: "geometry", stylers: [{ color: "#757575" }] },
          { featureType: "poi", elementType: "labels.text.fill", stylers: [{ color: "#757575" }] },
          { featureType: "road", elementType: "geometry.fill", stylers: [{ color: "#2c2c2c" }] },
          { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#8a8a8a" }] },
          { featureType: "transit", elementType: "geometry", stylers: [{ color: "#2f3948" }] },
          { featureType: "water", elementType: "geometry", stylers: [{ color: "#000000" }] }
        ]
      });

      // Initialize Routing Services
      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({
        map: map,
        suppressMarkers: false,
        polylineOptions: { strokeColor: "#00ff66", strokeWeight: 5 }
      });

      // Local user position marker
      myMarker = new google.maps.Marker({
        position: defaultCenter,
        map: map,
        title: "Your Location",
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 7,
          fillColor: "#00ff66",
          fillOpacity: 1,
          strokeColor: "#ffffff",
          strokeWeight: 2
        }
      });
    }

    // --- NAVIGATION ROUTING ---
    function navigateToTarget(targetLat, targetLng) {
      if (!myLatLng) {
        alert("GPS location not yet available.");
        return;
      }

      // Scroll automatically to Map Page
      document.getElementById('app-viewport').scrollTo({
        left: window.innerWidth,
        behavior: 'smooth'
      });

      // Request directions via Google Directions API
      directionsService.route(
        {
          origin: myLatLng,
          destination: { lat: targetLat, lng: targetLng },
          travelMode: google.maps.TravelMode.DRIVING
        },
        (response, status) => {
          if (status === "OK") {
            directionsRenderer.setDirections(response);
          } else {
            alert("Route calculation failed: " + status);
          }
        }
      );
    }
  </script>

  <!-- GOOGLE MAPS API SCRIPT -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDtQzAOxGO5wkQuk8YI-QezE7Z-KJbGkFo&libraries=geometry,places&callback=initMap" async defer></script>
</body>
</html>
