<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>R34L_T4LK</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated Loading Screen -->
  <div id="loading-screen" class="loading-screen">
    <div id="loading-text" class="loading-text"></div>
  </div>

  <!-- Main Web App Container -->
  <div class="app-container">
    
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="spacer"></div>
      <div class="title-container">
        <h1 class="app-title">R34L_T4LK</h1>
        <span class="status-badge">ONLINE</span>
      </div>
      <button id="gear-btn" class="icon-btn">⚙️</button>
    </header>

    <!-- Circular Hold to Talk Button -->
    <main class="talk-container">
      <button id="talk-btn" class="talk-btn">
        <span id="talk-label">HOLD TO TALK</span>
      </button>
    </main>

    <!-- Bottom Trigger Button -->
    <footer class="bottom-bar">
      <button id="dual-audio-btn" class="purple-btn">
        DUAL AUDIO // ROUTE TO WIRE + BT
      </button>
    </footer>

  </div>

  <!-- Bottom Slide-up Drawer (Dual Audio Routing) -->
  <div id="audio-backdrop" class="backdrop"></div>
  <div id="audio-drawer" class="drawer bottom-drawer">
    <div class="drawer-handle"></div>
    <div class="drawer-header">
      <h2>Dual Audio Routing Hub</h2>
      <button id="close-audio-btn" class="close-btn">✕</button>
    </div>

    <div class="drawer-section">
      <label class="section-label">HARDWARE PAIRING MODE</label>
      <div class="grid-2">
        <button id="mode-wire-bt" class="mode-btn active">1 Wired + 1 Bluetooth</button>
        <button id="mode-bt-bt" class="mode-btn">2 Bluetooth Devices</button>
      </div>
    </div>

    <div class="drawer-section">
      <div class="device-card primary">
        <span class="card-tag primary-tag">PRIMARY OUTPUT (A)</span>
        <span id="device-a-label" class="card-name">Analog/Type-C Wired Headset</span>
        <input type="range" id="vol-a" min="0" max="1" step="0.01" value="1" class="slider primary-slider" />
      </div>

      <div class="device-card secondary">
        <span class="card-tag secondary-tag">SECONDARY OUTPUT (B)</span>
        <span id="device-b-label" class="card-name">Bluetooth Wireless Audio</span>
        <input type="range" id="vol-b" min="0" max="1" step="0.01" value="1" class="slider secondary-slider" />
      </div>
    </div>

    <div class="drawer-section">
      <label class="section-label">ZERO-LOSS EQUALIZER PRESETS</label>
      <div class="grid-3">
        <button id="eq-studio" class="eq-btn active">STUDIO</button>
        <button id="eq-bass" class="eq-btn">BASS</button>
        <button id="eq-treble" class="eq-btn">TREBLE</button>
      </div>
    </div>
  </div>

  <!-- Right Slide-in Panel (Settings & Fixed User QR) -->
  <div id="settings-backdrop" class="backdrop"></div>
  <div id="settings-drawer" class="drawer right-drawer">
    <div class="drawer-header">
      <h2>Settings & Identity</h2>
      <button id="close-settings-btn" class="close-btn">✕</button>
    </div>

    <!-- Fixed User QR Card -->
    <div class="qr-card">
      <span class="section-label">YOUR PERMANENT QR IDENTITY</span>
      <div class="qr-matrix"></div>
      <span id="user-id-text" class="user-id">R34L-USR-9042</span>
    </div>

    <!-- Link User Section -->
    <div class="drawer-section">
      <label class="section-label">LINK PERMANENT USER</label>
      <button id="scan-qr-btn" class="scan-btn">📷 SCAN USER QR</button>
      <div class="input-row">
        <input type="text" id="manual-id-input" placeholder="Or enter user ID..." />
        <button id="link-id-btn" class="action-btn">LINK</button>
      </div>
    </div>

    <!-- Linked Friends List -->
    <div class="drawer-section">
      <label class="section-label">PERMANENTLY LINKED FRIENDS</label>
      <div id="linked-users-list" class="linked-list"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="audioEngine.js"></script>
  <script src="app.js"></script>
</body>
</html>
