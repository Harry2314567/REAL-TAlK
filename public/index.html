<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R34L_T4LK // Tactical Comms</title>
    <style>
        :root {
            --bg-dark: #05070a;
            --cyan-glow: #00f0ff;
            --orange-alert: #ff2a5f;
            --green-active: #00ff66;
            --text-main: #e6f1ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            overflow: hidden;
        }

        /* Pure Futuristic Neon Loading Screen Overlay */
        #bootScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .neon-loader-container {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
        }

        .neon-char {
            font-size: 3.2rem;
            font-weight: 900;
            font-style: italic;
            color: #121820;
            transition: color 0.12s ease-in-out, text-shadow 0.12s ease-in-out;
        }

        .neon-char.active {
            color: var(--cyan-glow);
            text-shadow: 0 0 12px var(--cyan-glow), 0 0 25px var(--cyan-glow), 0 0 50px var(--cyan-glow);
        }

        .start-btn {
            background: transparent;
            color: var(--cyan-glow);
            font-family: monospace;
            font-weight: 900;
            font-style: italic;
            padding: 16px 36px;
            border-radius: 4px;
            border: 2px solid var(--cyan-glow);
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.2);
            font-size: 1rem;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            text-shadow: 0 0 8px var(--cyan-glow);
        }

        .start-btn:active {
            background: var(--cyan-glow);
            color: #000;
            box-shadow: 0 0 30px var(--cyan-glow);
            transform: scale(0.96);
        }

        /* Main UI Interface */
        .header { text-align: center; margin-top: 10px; }
        .header h1 { font-size: 1.8rem; letter-spacing: 3px; color: var(--cyan-glow); font-style: italic; }
        .status { font-size: 0.85rem; color: #555; margin-top: 5px; letter-spacing: 2px; }
        .status.online { color: var(--green-active); text-shadow: 0 0 8px var(--green-active); }

        .ptt-button {
            width: 220px; height: 220px; border-radius: 50%;
            background: #0d1117; border: 3px solid var(--cyan-glow);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .ptt-button:active, .ptt-button.active {
            background: #1a080d; border-color: var(--orange-alert);
            box-shadow: 0 0 40px rgba(255, 42, 95, 0.4); transform: scale(0.95);
        }

        .ptt-button.receiving {
            border-color: var(--green-active); box-shadow: 0 0 35px rgba(0, 255, 102, 0.4);
        }

        .btn-label { font-weight: 800; font-size: 0.95rem; letter-spacing: 2px; color: var(--text-main); font-style: italic; }
        .footer-info { font-size: 0.75rem; color: #444; text-align: center; letter-spacing: 1px; }

        audio { display: none; }
    </style>
</head>
<body>

    <audio id="remoteAudio" autoplay playsinline></audio>

    <!-- Clean Neon Boot Screen -->
    <div id="bootScreen">
        <div class="neon-loader-container" id="neonLoader">
            <span class="neon-char">R</span>
            <span class="neon-char">3</span>
            <span class="neon-char">4</span>
            <span class="neon-char">L</span>
            <span class="neon-char">_</span>
            <span class="neon-char">T</span>
            <span class="neon-char">4</span>
            <span class="neon-char">L</span>
            <span class="neon-char">K</span>
        </div>
        <button class="start-btn" id="startBtn">INITIALIZE SYSTEM</button>
    </div>

    <div class="header">
        <h1>R34L_T4LK</h1>
        <div class="status" id="statusText">DISCONNECTED</div>
    </div>

    <div class="ptt-button" id="pttBtn">
        <div class="btn-label" id="btnLabel">HOLD TO TALK</div>
    </div>

    <div class="footer-info">
        PUSH BUTTON OR SPACEBAR TO TRANSMIT
    </div>

    <script>
        let ws;
        let localStream;
        let peerConnection;
        let isTransmitting = false;

        const chars = document.querySelectorAll('.neon-char');
        const startBtn = document.getElementById('startBtn');
        const bootScreen = document.getElementById('bootScreen');
        const pttBtn = document.getElementById('pttBtn');
        const btnLabel = document.getElementById('btnLabel');
        const statusText = document.getElementById('statusText');
        const remoteAudio = document.getElementById('remoteAudio');

        // Continuous Neon Letter Flash Cycle
        let activeIdx = 0;
        const loadInterval = setInterval(() => {
            chars.forEach((c, idx) => {
                if (idx === activeIdx) {
                    c.classList.add('active');
                } else {
                    c.classList.remove('active');
                }
            });
            activeIdx = (activeIdx + 1) % chars.length;
        }, 110);

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        startBtn.addEventListener('click', async () => {
            clearInterval(loadInterval);
            chars.forEach(c => c.classList.add('active'));

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });

                localStream.getAudioTracks().forEach(track => track.enabled = false);

                bootScreen.style.opacity = '0';
                setTimeout(() => bootScreen.style.display = 'none', 800);

                connectWebSocket();
            } catch (err) {
                alert("Microphone permission required.");
            }
        });

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + window.location.host);

            ws.onopen = () => {
                statusText.innerText = "ONLINE";
                statusText.classList.add('online');
                initPeerConnection();
            };

            ws.onclose = () => {
                statusText.innerText = "DISCONNECTED";
                statusText.classList.remove('online');
                setTimeout(connectWebSocket, 2000);
            };

            ws.onmessage = async (event) => {
                const message = JSON.parse(event.data);

                if (message.offer) {
                    if (!peerConnection) initPeerConnection();
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(message.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    ws.send(JSON.stringify({ answer }));
                } else if (message.answer) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(message.answer));
                } else if (message.candidate) {
                    if (peerConnection) {
                        try {
                            await peerConnection.addIceCandidate(new RTCIceCandidate(message.candidate));
                        } catch (e) {}
                    }
                }
            };
        }

        function initPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                remoteAudio.srcObject = event.streams[0];
                remoteAudio.play().catch(e => console.log(e));
                pttBtn.classList.add('receiving');
                btnLabel.innerText = "RECEIVING";
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ candidate: event.candidate }));
                }
            };

            peerConnection.createOffer().then(offer => {
                return peerConnection.setLocalDescription(offer);
            }).then(() => {
                ws.send(JSON.stringify({ offer: peerConnection.localDescription }));
            });
        }

        function startTalking() {
            if (isTransmitting || !localStream) return;
            isTransmitting = true;
            pttBtn.classList.add('active');
            btnLabel.innerText = "TRANSMITTING";
            if (navigator.vibrate) navigator.vibrate(40);

            localStream.getAudioTracks().forEach(track => track.enabled = true);
        }

        function stopTalking() {
            if (!isTransmitting || !localStream) return;
            isTransmitting = false;
            pttBtn.classList.remove('active');
            btnLabel.innerText = "HOLD TO TALK";

            localStream.getAudioTracks().forEach(track => track.enabled = false);
        }

        pttBtn.addEventListener('mousedown', startTalking);
        pttBtn.addEventListener('mouseup', stopTalking);
        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
        pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });

        window.addEventListener('keydown', (e) => { if (e.code === 'Space' && !e.repeat) startTalking(); });
        window.addEventListener('keyup', (e) => { if (e.code === 'Space') stopTalking(); });
    </script>
</body>
</html>
