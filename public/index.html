<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Squad Radio Comms</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      color: #00ff66;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #app-container {
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: #141414;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid #222;
    }

    .status-badge {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #1a2a1e;
      color: #00ff66;
      border: 1px solid #00ff66;
    }

    .status-badge.offline {
      background: #2a1a1a;
      color: #ff3333;
      border-color: #ff3333;
    }

    /* PTT BUTTON */
    .ptt-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px 0;
    }

    #ptt-btn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 4px solid #00ff66;
      background: radial-gradient(circle, rgba(0,255,102,0.15) 0%, rgba(0,0,0,0.8) 100%);
      color: #00ff66;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.2);
      outline: none;
      touch-action: manipulation;
      user-select: none;
      transition: all 0.1s ease;
    }

    #ptt-btn:active, #ptt-btn.transmitting {
      background: #00ff66;
      color: #000;
      box-shadow: 0 0 50px #00ff66;
      transform: scale(0.96);
    }

    /* ALERT / EMERGENCY BUTTON */
    #alert-btn {
      width: 100%;
      padding: 12px;
      background: rgba(255, 51, 51, 0.1);
      border: 1px solid #ff3333;
      color: #ff3333;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    #alert-btn:active {
      background: #ff3333;
      color: #000;
    }

    /* SQUAD LIST */
    .squad-section {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-top: 15px;
    }

    .squad-title {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    #squad-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .squad-card {
      background: #1c1c1c;
      padding: 10px 14px;
      border-radius: 6px;
      border-left: 3px solid #00ff66;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .squad-card.talking {
      border-left-color: #ffcc00;
      background: #262215;
    }

    .callsign {
      color: #fff;
      font-weight: bold;
      font-size: 13px;
    }

    .member-status {
      font-size: 10px;
      color: #888;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div class="header">
      <h3 style="letter-spacing: 1px;">SQUAD RADIO</h3>
      <div id="connection-status" class="status-badge">CONNECTING...</div>
    </div>

    <div class="ptt-wrapper">
      <button id="ptt-btn">HOLD TO TALK</button>
      <button id="alert-btn" onclick="triggerAlert()">⚠️ SEND ALERT</button>
    </div>

    <div class="squad-section">
      <div class="squad-title">ACTIVE FREQUENCY</div>
      <div id="squad-list"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let audioCtx = null;
    let localStream = null;
    let myId = null;
    const callsign = 'SOLDIER-' + Math.floor(1000 + Math.random() * 9000);

    // Audio Context Setup
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Voice & Sound Synthesizer
    function speak(text, pitchModifier = 1) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.1;
      utterance.pitch = pitchModifier;
      window.speechSynthesis.speak(utterance);
    }

    // Sound 1: User Joined Ping (Clean High Double-Tone)
    function playJoinPing() {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.setValueAtTime(1760, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }

    // Sound 2: Alert Ping (Urgent Staccato Alarm)
    function playAlertPing() {
      const ctx = getAudioContext();
      for (let i = 0; i < 3; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1200, ctx.currentTime + (i * 0.12));
        gain.gain.setValueAtTime(0.3, ctx.currentTime + (i * 0.12));
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (i * 0.12) + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + (i * 0.12));
        osc.stop(ctx.currentTime + (i * 0.12) + 0.08);
      }
    }

    // Sound 3: Glitch Noise for Network Errors
    function playGlitchNoise() {
      const ctx = getAudioContext();
      const bufferSize = ctx.sampleRate * 0.2; // 200ms
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const whiteNoise = ctx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1000;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      whiteNoise.start();
    }

    // Microphone Setup
    async function initAudio() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        localStream.getAudioTracks().forEach(t => t.enabled = false);
      } catch (e) {
        console.warn("Microphone access pending or denied.");
      }
    }

    // Push To Talk Controls
    const pttBtn = document.getElementById('ptt-btn');

    function startTransmit() {
      getAudioContext();
      if (!localStream) return;
      pttBtn.classList.add('transmitting');
      pttBtn.innerText = "TRANSMITTING";
      localStream.getAudioTracks().forEach(t => t.enabled = true);
      socket.emit('talk-status', { talking: true, username: callsign });
    }

    function stopTransmit() {
      if (!localStream) return;
      pttBtn.classList.remove('transmitting');
      pttBtn.innerText = "HOLD TO TALK";
      localStream.getAudioTracks().forEach(t => t.enabled = false);
      socket.emit('talk-status', { talking: false, username: callsign });
    }

    pttBtn.addEventListener('mousedown', startTransmit);
    pttBtn.addEventListener('mouseup', stopTransmit);
    pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTransmit(); });
    pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTransmit(); });

    function triggerAlert() {
      getAudioContext();
      socket.emit('send-alert', { username: callsign });
    }

    // Socket Event Handlers
    socket.on('connect', () => {
      myId = socket.id;
      const statusEl = document.getElementById('connection-status');
      statusEl.innerText = 'ONLINE';
      statusEl.classList.remove('offline');

      speak("Connected");
      socket.emit('join-room', { room: 'ALPHA-1', username: callsign });
    });

    socket.on('disconnect', () => {
      const statusEl = document.getElementById('connection-status');
      statusEl.innerText = 'OFFLINE';
      statusEl.classList.add('offline');

      playGlitchNoise();
      setTimeout(() => speak("Network error", 0.7), 250);
    });

    socket.on('joined-successfully', ({ members }) => {
      initAudio();
      renderSquad(members);
    });

    socket.on('user-joined', ({ id, username }) => {
      playJoinPing();
      setTimeout(() => speak(`${username} is live`), 300);
      addOrUpdateMember(id, username, false);
    });

    socket.on('user-left', ({ id, username }) => {
      speak("Disconnected");
      const el = document.getElementById(`user-${id}`);
      if (el) el.remove();
    });

    socket.on('user-talk-status', ({ id, username, talking }) => {
      addOrUpdateMember(id, username, talking);
    });

    socket.on('receive-alert', ({ username }) => {
      playAlertPing();
      setTimeout(() => speak(`${username} sent alert`, 1.2), 400);
    });

    function renderSquad(members) {
      const listEl = document.getElementById('squad-list');
      listEl.innerHTML = '';
      members.forEach(m => addOrUpdateMember(m.id, m.username, false));
    }

    function addOrUpdateMember(id, username, talking) {
      const listEl = document.getElementById('squad-list');
      let card = document.getElementById(`user-${id}`);

      if (!card) {
        card = document.createElement('div');
        card.id = `user-${id}`;
        listEl.appendChild(card);
      }

      card.className = `squad-card ${talking ? 'talking' : ''}`;
      card.innerHTML = `
        <div>
          <div class="callsign">${username || 'SOLDIER'} ${id === myId ? '(YOU)' : ''}</div>
          <div class="member-status">${talking ? 'TRANSMITTING...' : 'STANDBY'}</div>
        </div>
      `;
    }
  </script>
</body>
</html>
