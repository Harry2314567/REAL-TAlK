<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WALKIE TALKIE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
        }

        .header {
            text-align: center;
            margin-top: 10px;
        }

        .header h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: #00ffcc;
        }

        .status {
            font-size: 0.9rem;
            color: #888;
            margin-top: 5px;
        }

        .status.online {
            color: #00ff66;
        }

        /* Large Touch Button */
        .ptt-button {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: #1e1e1e;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .ptt-button:active, .ptt-button.active {
            background: #2a1111;
            border-color: #ff3366;
            box-shadow: 0 0 35px rgba(255, 51, 102, 0.5);
            transform: scale(0.95);
        }

        .ptt-button.receiving {
            border-color: #00ff66;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.4);
        }

        .mic-icon {
            font-size: 3rem;
            margin-bottom: 8px;
        }

        .btn-label {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .footer-info {
            font-size: 0.75rem;
            color: #555;
            text-align: center;
        }

        /* Initial Tap Overlay for Browser Audio Permission */
        #startModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .start-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
        }
    </style>
</head>
<body>

    <div id="startModal">
        <button class="start-btn" id="startBtn">TAP TO START TALKIE</button>
    </div>

    <div class="header">
        <h1>WALKIE TALKIE</h1>
        <div class="status" id="statusText">CONNECTING...</div>
    </div>

    <div class="ptt-button" id="pttBtn">
        <div class="mic-icon">🎙️</div>
        <div class="btn-label" id="btnLabel">HOLD TO TALK</div>
    </div>

    <div class="footer-info">
        Press button or holding Spacebar to talk
    </div>

    <script>
        let ws;
        let mediaRecorder;
        let micStream;
        let isTransmitting = false;

        const pttBtn = document.getElementById('pttBtn');
        const btnLabel = document.getElementById('btnLabel');
        const statusText = document.getElementById('statusText');
        const startModal = document.getElementById('startModal');
        const startBtn = document.getElementById('startBtn');

        startBtn.addEventListener('click', async () => {
            startModal.style.display = 'none';

            try {
                // Request Microphone Permission
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                setupMediaRecorder();
                connectWebSocket();
            } catch (err) {
                alert("Microphone permission required for walkie talkie!");
            }
        });

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + window.location.host);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                statusText.innerText = "ONLINE // READY";
                statusText.classList.add('online');
            };

            ws.onclose = () => {
                statusText.innerText = "DISCONNECTED";
                statusText.classList.remove('online');
                setTimeout(connectWebSocket, 2000);
            };

            ws.onmessage = async (event) => {
                // Play incoming live voice buffer directly
                if (event.data instanceof ArrayBuffer) {
                    playAudioBuffer(event.data);
                }
            };
        }

        function setupMediaRecorder() {
            mediaRecorder = new MediaRecorder(micStream);
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN && isTransmitting) {
                    ws.send(e.data);
                }
            };
        }

        async function playAudioBuffer(buffer) {
            try {
                pttBtn.classList.add('receiving');
                btnLabel.innerText = "INCOMING VOICE...";

                const blob = new Blob([buffer], { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                await audio.play();

                setTimeout(() => {
                    if (!isTransmitting) {
                        pttBtn.classList.remove('receiving');
                        btnLabel.innerText = "HOLD TO TALK";
                    }
                }, 400);
            } catch (err) {
                console.log("Audio play error:", err);
            }
        }

        function startTalking() {
            if (isTransmitting) return;
            isTransmitting = true;
            pttBtn.classList.add('active');
            btnLabel.innerText = "TALKING...";
            if (navigator.vibrate) navigator.vibrate(40);

            if (mediaRecorder && mediaRecorder.state === 'inactive') {
                mediaRecorder.start(100); // Record & send audio in 100ms chunks
            }
        }

        function stopTalking() {
            if (!isTransmitting) return;
            isTransmitting = false;
            pttBtn.classList.remove('active');
            btnLabel.innerText = "HOLD TO TALK";

            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
        }

        // Touch & Mouse Listeners
        pttBtn.addEventListener('mousedown', startTalking);
        pttBtn.addEventListener('mouseup', stopTalking);
        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
        pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });

        // Spacebar Control
        window.addEventListener('keydown', (e) => { if (e.code === 'Space' && !e.repeat) startTalking(); });
        window.addEventListener('keyup', (e) => { if (e.code === 'Space') stopTalking(); });
    </script>
</body>
</html>
