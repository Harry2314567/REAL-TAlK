<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>REAL_TALK // MONOCHROME MONO-PTT</title>

  <!-- Leaflet GIS Map Engine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-core: #000000;
      --panel-bg: rgba(18, 18, 18, 0.95);
      --bw-white: #ffffff;
      --bw-light-gray: #d1d5db;
      --bw-mid-gray: #4b5563;
      --bw-dark-gray: #111827;
      --alert-red: #ff3333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-core);
      color: var(--bw-white);
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Top Black & White HUD Header */
    .hud-header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--bw-white);
      padding-bottom: 10px;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--bw-white);
      text-transform: uppercase;
    }

    .device-switcher {
      display: flex;
      gap: 6px;
    }

    .mode-btn {
      background: var(--bw-dark-gray);
      border: 1px solid var(--bw-white);
      color: var(--bw-white);
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
      border-radius: 2px;
      text-transform: uppercase;
    }

    .mode-btn.active {
      background: var(--bw-white);
      color: #000000;
      font-weight: bold;
    }

    /* Main Console Container */
    .console-container {
      width: 100%;
      max-width: 480px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Input Device Selection */
    .device-box {
      width: 100%;
      margin-bottom: 20px;
      text-align: center;
    }

    .device-box label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--bw-light-gray);
      display: block;
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      padding: 10px;
      background: #000000;
      color: var(--bw-white);
      border: 1px solid var(--bw-white);
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }

    /* Rectangular Morphing PTT Button */
    #talkBtn {
      width: 100%;
      height: 140px;
      background: #0d0d0d;
      border: 2px solid var(--bw-white);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }

    #talkBtn.transmitting {
      border-color: var(--alert-red);
      background: #1a0000;
      box-shadow: 0 0 25px rgba(255, 51, 51, 0.4);
    }

    .btn-label {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 3px;
      color: var(--bw-white);
      z-index: 2;
    }

    #talkBtn.transmitting .btn-label {
      color: var(--alert-red);
      font-size: 12px;
      margin-bottom: 8px;
    }

    /* Real-time Canvas Equalizer */
    #visCanvas {
      position: absolute;
      width: 90%;
      height: 50px;
      bottom: 15px;
      display: none;
      z-index: 2;
    }

    #status {
      margin-top: 15px;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--bw-light-gray);
      text-align: center;
    }

    /* Swipe-Up Drawer Button */
    .drawer-trigger {
      width: 100%;
      max-width: 480px;
      background: #0a0a0a;
      border: 1px solid var(--bw-white);
      padding: 12px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      margin-top: 15px;
    }

    .drawer-trigger span {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--bw-white);
      font-weight: bold;
    }

    /* Black and White Map Drawer */
    #mapDrawer {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      height: 80vh;
      background: #000000;
      border-top: 2px solid var(--bw-white);
      transition: bottom 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    #mapDrawer.open {
      bottom: 0;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    /* Real Leaflet Map Container */
    #map {
      flex: 1;
      width: 100%;
      border: 1px solid var(--bw-white);
      border-radius: 4px;
      background: #000;
    }

    /* Apply Grayscale / Black & White Filter to Map Tiles */
    .leaflet-tile-container img {
      filter: grayscale(100%) invert(100%) contrast(150%) brightness(80%);
    }

    /* Target Selector Overlay */
    #targetWheel {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    /* Translucent Blue Circular Target Ring */
    .wheel-ring {
      width: 300px;
      height: 300px;
      background: rgba(0, 243, 255, 0.25);
      border: 2px solid var(--bw-white);
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel-divider {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50%;
      height: 2px;
      background: var(--alert-red);
      transform-origin: left center;
      pointer-events: none;
    }

    .wheel-node {
      position: absolute;
      padding: 6px 10px;
      background: #000;
      border: 1px solid var(--bw-white);
      color: #fff;
      font-size: 10px;
      border-radius: 2px;
      cursor: pointer;
      z-index: 5;
      transform: translate(-50%, -50%);
    }

    #pointerDot {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--alert-red);
      border: 2px solid #fff;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 250;
      display: none;
    }

    /* Android Watch Layout Mode */
    body.watch-mode {
      justify-content: center;
      background: #000;
    }
    body.watch-mode .console-container {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 3px solid var(--bw-white);
      background: #000;
      padding: 15px;
      justify-content: center;
    }
    body.watch-mode .hud-header,
    body.watch-mode .device-box,
    body.watch-mode .drawer-trigger {
      display: none;
    }
    body.watch-mode #talkBtn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <!-- Top HUD Header -->
  <div class="hud-header">
    <div class="logo">REAL_TALK</div>
    <div class="device-switcher">
      <button class="mode-btn active" id="mobileBtn" onclick="setMode('mobile')">MOBILE</button>
      <button class="mode-btn" id="watchBtn" onclick="setMode('watch')">WATCH</button>
    </div>
  </div>

  <!-- Main Console Container -->
  <div class="console-container">
    <div class="device-box">
      <label>AUDIO INPUT DEVICE</label>
      <select id="micSelect"></select>
    </div>

    <!-- PTT Button -->
    <button id="talkBtn">
      <span class="btn-label" id="btnText">HOLD / TAP TO TALK</span>
      <canvas id="visCanvas"></canvas>
    </button>

    <div id="status">INITIALIZING SYSTEM...</div>
  </div>

  <!-- Swipe Up Drawer Button -->
  <div class="drawer-trigger" onclick="toggleDrawer(true)">
    <span>▲ TAP / SWIPE FOR BLACK & WHITE MAP</span>
    <span style="font-size: 14px;">🎯</span>
  </div>

  <!-- Map Drawer -->
  <div id="mapDrawer">
    <div class="drawer-header">
      <span style="font-size: 12px; font-weight: bold; letter-spacing: 2px;">TACTICAL B&W MAP</span>
      <div style="display: flex; gap: 8px;">
        <button class="mode-btn" onclick="openTargetWheel()">TARGETS</button>
        <button class="mode-btn" onclick="toggleDrawer(false)" style="border-color: var(--alert-red); color: var(--alert-red);">CLOSE [X]</button>
      </div>
    </div>
    <!-- Real Leaflet Map Container -->
    <div id="map"></div>
  </div>

  <!-- Target Selector Wheel -->
  <div id="targetWheel" onmousemove="updateWheelPointer(event)" ontouchmove="updateWheelPointer(event)">
    <div class="wheel-ring" id="wheelRing"></div>
  </div>
  <div id="pointerDot"></div>

  <!-- Leaflet Map Script JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    const talkBtn = document.getElementById('talkBtn');
    const btnText = document.getElementById('btnText');
    const statusDiv = document.getElementById('status');
    const micSelect = document.getElementById('micSelect');
    const visCanvas = document.getElementById('visCanvas');
    const canvasCtx = visCanvas.getContext('2d');

    let audioStream;
    let mediaRecorder;
    let audioCtx;
    let analyser;
    let animFrame;
    let isTransmitting = false;

    // Fixed Web Audio Playback Engine
    let playAudioCtx;

    function initPlaybackAudioContext() {
      if (!playAudioCtx) {
        playAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (playAudioCtx.state === 'suspended') {
        playAudioCtx.resume();
      }
    }

    socket.on('connect', () => {
      statusDiv.innerText = 'STATUS: ONLINE // SECURE';
    });

    socket.on('disconnect', () => {
      statusDiv.innerText = 'STATUS: OFFLINE // RECONNECTING';
    });

    // Receive and decode raw incoming WebM audio streams
    socket.on('audio-stream', async ({ sender, buffer }) => {
      initPlaybackAudioContext();
      try {
        const audioBuffer = await playAudioCtx.decodeAudioData(buffer);
        const source = playAudioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(playAudioCtx.destination);
        source.start(0);
      } catch (err) {
        console.error('Audio decode error:', err);
      }
    });

    // Detect and populates microphones
    async function loadMicrophones() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioStream = stream;

        const devices = await navigator.mediaDevices.enumerateDevices();
        const inputs = devices.filter(d => d.kind === 'audioinput');

        micSelect.innerHTML = '';
        inputs.forEach((device, index) => {
          const opt = document.createElement('option');
          opt.value = device.deviceId;
          opt.text = device.label || `Microphone ${index + 1}`;
          micSelect.appendChild(opt);
        });

        if (micSelect.value) {
          setAudioInputDevice(micSelect.value);
        }
      } catch (err) {
        statusDiv.innerText = 'MIC PERMISSION DENIED!';
      }
    }

    async function setAudioInputDevice(deviceId) {
      if (audioStream) {
        audioStream.getTracks().forEach(t => t.stop());
      }
      audioStream = await navigator.mediaDevices.getUserMedia({
        audio: { deviceId: { exact: deviceId } }
      });
    }

    micSelect.addEventListener('change', () => setAudioInputDevice(micSelect.value));

    // Canvas Equalizer Visualizer
    function setupVisualizer(stream) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      source.connect(analyser);

      visCanvas.style.display = 'block';
      renderVisualizer();
    }

    function renderVisualizer() {
      animFrame = requestAnimationFrame(renderVisualizer);
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      visCanvas.width = visCanvas.offsetWidth;
      visCanvas.height = visCanvas.offsetHeight;
      canvasCtx.clearRect(0, 0, visCanvas.width, visCanvas.height);

      const barWidth = (visCanvas.width / bufferLength) * 2.2;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * visCanvas.height;
        canvasCtx.fillStyle = '#ffffff'; // Black & White Bars
        canvasCtx.fillRect(x, visCanvas.height - barHeight, barWidth - 2, barHeight);
        x += barWidth + 2;
      }
    }

    // PTT Transmission logic
    function startTransmitting() {
      initPlaybackAudioContext();
      if (!audioStream) return;

      isTransmitting = true;
      talkBtn.classList.add('transmitting');
      btnText.innerText = 'TRANSMITTING...';
      statusDiv.innerText = 'STATUS: BROADCASTING LIVE';

      setupVisualizer(audioStream);

      mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });
      mediaRecorder.ondataavailable = async (e) => {
        if (e.data.size > 0 && socket.connected) {
          const arrayBuffer = await e.data.arrayBuffer();
          socket.emit('audio-stream', arrayBuffer);
        }
      };
      mediaRecorder.start(250);
    }

    function stopTransmitting() {
      if (!isTransmitting) return;
      isTransmitting = false;
      talkBtn.classList.remove('transmitting');
      btnText.innerText = 'HOLD / TAP TO TALK';
      statusDiv.innerText = 'STATUS: ONLINE // SECURE';

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      if (animFrame) cancelAnimationFrame(animFrame);
      visCanvas.style.display = 'none';
      if (audioCtx && audioCtx.state !== 'closed') {
        audioCtx.close();
      }
    }

    talkBtn.addEventListener('mousedown', startTransmitting);
    talkBtn.addEventListener('mouseup', stopTransmitting);
    talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTransmitting(); });
    talkBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTransmitting(); });

    // Mode Switcher (Watch vs Mobile)
    function setMode(mode) {
      document.getElementById('mobileBtn').classList.remove('active');
      document.getElementById('watchBtn').classList.remove('active');

      if (mode === 'watch') {
        document.body.classList.add('watch-mode');
        document.getElementById('watchBtn').classList.add('active');
      } else {
        document.body.classList.remove('watch-mode');
        document.getElementById('mobileBtn').classList.add('active');
      }
    }

    // Leaflet GPS Black & White Map Integration
    let map;
    let userMarker;
    const peerMarkers = {};

    function initMap() {
      if (map) return;

      // Default centered at center location
      map = L.map('map').setView([17.6521, 78.9482], 13);

      // OpenStreetMap Black & White Grayscale Tile Layer
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      // Track current user position with GPS
      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition((pos) => {
          const { latitude, longitude } = pos.coords;
          const latlng = [latitude, longitude];

          if (!userMarker) {
            userMarker = L.circleMarker(latlng, {
              color: '#ffffff',
              fillColor: '#ffffff',
              fillOpacity: 1,
              radius: 8
            }).addTo(map).bindPopup('YOU');
            map.setView(latlng, 15);
          } else {
            userMarker.setLatLng(latlng);
          }

          socket.emit('telemetry', { lat: latitude, lng: longitude });
        }, (err) => console.log('GPS error:', err), { enableHighAccuracy: true });
      }
    }

    socket.on('telemetry-update', (operators) => {
      if (!map) return;
      Object.keys(operators).forEach((id) => {
        if (id === socket.id) return;
        const op = operators[id];
        if (op.lat && op.lng) {
          if (!peerMarkers[id]) {
            peerMarkers[id] = L.circleMarker([op.lat, op.lng], {
              color: '#ff3333',
              fillColor: '#ff3333',
              fillOpacity: 1,
              radius: 6
            }).addTo(map).bindPopup(`OPERATOR: ${id.substring(0, 5)}`);
          } else {
            peerMarkers[id].setLatLng([op.lat, op.lng]);
          }
        }
      });
    });

    function toggleDrawer(open) {
      const drawer = document.getElementById('mapDrawer');
      if (open) {
        drawer.classList.add('open');
        setTimeout(() => {
          initMap();
          map.invalidateSize();
        }, 400);
      } else {
        drawer.classList.remove('open');
      }
    }

    // Target Selection Wheel
    const targetNames = ["ALPHA", "BRAVO", "CHARLIE", "DELTA", "ECHO", "FOXTROT"];
    let pointerX = window.innerWidth / 2;
    let pointerY = window.innerHeight / 2;
    let targetX = pointerX;
    let targetY = pointerY;

    function openTargetWheel() {
      const wheel = document.getElementById('targetWheel');
      const ring = document.getElementById('wheelRing');
      const dot = document.getElementById('pointerDot');
      
      wheel.style.display = 'flex';
      dot.style.display = 'block';
      ring.innerHTML = '';

      const total = targetNames.length;
      targetNames.forEach((name, idx) => {
        const angle = (idx / total) * Math.PI * 2;

        const divider = document.createElement('div');
        divider.className = 'wheel-divider';
        divider.style.transform = `rotate(${angle * (180 / Math.PI)}deg)`;
        ring.appendChild(divider);

        const nodeAngle = angle + (Math.PI / total);
        const x = Math.cos(nodeAngle) * 70 + 150;
        const y = Math.sin(nodeAngle) * 70 + 150;

        const node = document.createElement('div');
        node.className = 'wheel-node';
        node.style.left = `${x}px`;
        node.style.top = `${y}px`;
        node.innerText = name;
        node.onclick = () => {
          alert(`Selected Target: ${name}`);
          closeTargetWheel();
        };
        ring.appendChild(node);
      });
    }

    function closeTargetWheel() {
      document.getElementById('targetWheel').style.display = 'none';
      document.getElementById('pointerDot').style.display = 'none';
    }

    function updateWheelPointer(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      targetX = clientX;
      targetY = clientY;
    }

    function animatePointer() {
      pointerX += (targetX - pointerX) * 0.15;
      pointerY += (targetY - pointerY) * 0.15;
      const dot = document.getElementById('pointerDot');
      dot.style.left = `${pointerX}px`;
      dot.style.top = `${pointerY}px`;
      requestAnimationFrame(animatePointer);
    }
    animatePointer();

    loadMicrophones();
  </script>
</body>
</html>
