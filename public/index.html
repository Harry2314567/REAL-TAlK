<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R34L_T4LK // Tactical Comms</title>
    <style>
        :root {
            --bg-dark: #05070a;
            --cyan-glow: #00f0ff;
            --orange-alert: #ff2a5f;
            --text-main: #e6f1ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            overflow: hidden;
        }

        /* Futuristic Neon Loading Screen Overlay */
        #bootScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        .neon-loader-container {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
        }

        .neon-char {
            font-size: 2.8rem;
            font-weight: 900;
            font-style: italic;
            color: #111;
            text-shadow: none;
            transition: color 0.15s ease, text-shadow 0.15s ease;
        }

        .neon-char.active {
            color: var(--cyan-glow);
            text-shadow: 0 0 10px var(--cyan-glow), 0 0 20px var(--cyan-glow), 0 0 40px var(--cyan-glow);
        }

        .boot-status {
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: #555;
            text-transform: uppercase;
        }

        /* Main App Interface */
        .header { text-align: center; margin-top: 10px; }
        .header h1 { font-size: 1.6rem; letter-spacing: 2px; color: var(--cyan-glow); }
        .status { font-size: 0.85rem; color: #555; margin-top: 5px; }
        .status.online { color: #00ff66; }

        .ptt-button {
            width: 220px; height: 220px; border-radius: 50%;
            background: #0d1117; border: 3px solid var(--cyan-glow);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .ptt-button:active, .ptt-button.active {
            background: #1a080d; border-color: var(--orange-alert);
            box-shadow: 0 0 40px rgba(255, 42, 95, 0.4); transform: scale(0.95);
        }

        .ptt-button.receiving {
            border-color: #00ff66; box-shadow: 0 0 35px rgba(0, 255, 102, 0.4);
        }

        .btn-label { font-weight: 800; font-size: 0.95rem; letter-spacing: 2px; color: var(--text-main); }
        .footer-info { font-size: 0.75rem; color: #444; text-align: center; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="bootScreen">
        <div class="neon-loader-container" id="neonLoader">
            <span class="neon-char">R</span>
            <span class="neon-char">3</span>
            <span class="neon-char">4</span>
            <span class="neon-char">L</span>
            <span class="neon-char">_</span>
            <span class="neon-char">T</span>
            <span class="neon-char">4</span>
            <span class="neon-char">L</span>
            <span class="neon-char">K</span>
        </div>
        <div class="boot-status" id="bootStatus">INITIALIZING AUDIO MESH</div>
    </div>

    <div class="header">
        <h1>R34L_T4LK</h1>
        <div class="status" id="statusText">CONNECTING</div>
    </div>

    <div class="ptt-button" id="pttBtn">
        <div class="btn-label" id="btnLabel">HOLD TO TALK</div>
    </div>

    <div class="footer-info">
        PUSH BUTTON OR SPACEBAR TO TRANSMIT
    </div>

    <script>
        let ws;
        let mediaRecorder;
        let micStream;
        let isTransmitting = false;

        const chars = document.querySelectorAll('.neon-char');
        const bootStatus = document.getElementById('bootStatus');
        const bootScreen = document.getElementById('bootScreen');
        const pttBtn = document.getElementById('pttBtn');
        const btnLabel = document.getElementById('btnLabel');
        const statusText = document.getElementById('statusText');

        // Futuristic Neon Letter Loading Animation Sequence
        window.addEventListener('DOMContentLoaded', () => {
            let activeIdx = 0;
            const statuses = ["INITIALIZING AUDIO MESH", "CALIBRATING CHANNELS", "SYSTEM READY"];
            let statusStep = 0;

            const loadInterval = setInterval(() => {
                chars.forEach((c, idx) => {
                    if (idx <= activeIdx) {
                        c.classList.add('active');
                    } else {
                        c.classList.remove('active');
                    }
                });

                activeIdx++;
                if (activeIdx >= chars.length) {
                    activeIdx = 0;
                    statusStep++;
                    if (statusStep < statuses.length) {
                        bootStatus.innerText = statuses[statusStep];
                    }
                }
            }, 120);

            // Auto initialize after load cycle
            setTimeout(async () => {
                clearInterval(loadInterval);
                chars.forEach(c => c.classList.add('active'));
                bootStatus.innerText = "ONLINE";

                setTimeout(async () => {
                    bootScreen.style.opacity = '0';
                    setTimeout(() => bootScreen.style.display = 'none', 800);

                    try {
                        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        setupMediaRecorder();
                        connectWebSocket();
                    } catch (e) {
                        alert("Microphone permission required.");
                    }
                }, 600);
            }, 3000);
        });

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + window.location.host);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                statusText.innerText = "ONLINE";
                statusText.classList.add('online');
            };

            ws.onclose = () => {
                statusText.innerText = "DISCONNECTED";
                statusText.classList.remove('online');
                setTimeout(connectWebSocket, 2000);
            };

            ws.onmessage = async (event) => {
                if (event.data instanceof ArrayBuffer) {
                    playAudioBuffer(event.data);
                }
            };
        }

        function setupMediaRecorder() {
            mediaRecorder = new MediaRecorder(micStream);
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN && isTransmitting) {
                    ws.send(e.data);
                }
            };
        }

        async function playAudioBuffer(buffer) {
            try {
                pttBtn.classList.add('receiving');
                btnLabel.innerText = "RECEIVING";

                const blob = new Blob([buffer], { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                await audio.play();

                setTimeout(() => {
                    if (!isTransmitting) {
                        pttBtn.classList.remove('receiving');
                        btnLabel.innerText = "HOLD TO TALK";
                    }
                }, 400);
            } catch (err) {
                console.log(err);
            }
        }

        function startTalking() {
            if (isTransmitting) return;
            isTransmitting = true;
            pttBtn.classList.add('active');
            btnLabel.innerText = "TRANSMITTING";
            if (navigator.vibrate) navigator.vibrate(40);

            if (mediaRecorder && mediaRecorder.state === 'inactive') {
                mediaRecorder.start(100);
            }
        }

        function stopTalking() {
            if (!isTransmitting) return;
            isTransmitting = false;
            pttBtn.classList.remove('active');
            btnLabel.innerText = "HOLD TO TALK";

            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
        }

        pttBtn.addEventListener('mousedown', startTalking);
        pttBtn.addEventListener('mouseup', stopTalking);
        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
        pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });

        window.addEventListener('keydown', (e) => { if (e.code === 'Space' && !e.repeat) startTalking(); });
        window.addEventListener('keyup', (e) => { if (e.code === 'Space') stopTalking(); });
    </script>
</body>
</html>
